name: Build dist & deploy test page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # commit the rebuilt dist back to main
  pages: write # deploy to GitHub Pages
  id-token: write # required by actions/deploy-pages

# Never run two builds of main at once; queue them instead of cancelling,
# so every push ends up with its dist committed and the page deployed.
concurrency:
  group: build-dist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build dist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Commit rebuilt dist
        run: |
          if [ -z "$(git status --porcelain -- dist)" ]; then
            echo "dist is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          git commit -m "Rebuild dist for ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:main

      - name: Assemble test page
        run: |
          mkdir -p _site
          cp -R test-page/. _site/
          cp -R dist _site/dist
          # List of available locales for the locale switcher.
          ls dist/l10n/*.js | xargs -n1 basename -s .js | grep -vx index \
            | jq -R . | jq -s . > _site/locales.json
          # Info about the build shown on the page.
          jq -n \
            --arg sha "$(git rev-parse HEAD)" \
            --arg source_sha "$GITHUB_SHA" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg version "$(node -p 'require("./package.json").version')" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{sha: $sha, source_sha: $source_sha, date: $date, version: $version, repo: $repo}' \
            > _site/build-info.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy test page
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
